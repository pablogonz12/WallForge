[package]
name = "wallforge-render"
version = "0.1.0"
edition = "2021"
description = "Low-overhead Wayland (wlr-layer-shell) wallpaper renderer for Wallpaper Engine video wallpapers"

[[bin]]
name = "wallforge-render"
path = "src/main.rs"

[dependencies]
wayland-client = "0.31"
wayland-backend = { version = "0.3", features = ["client_system"] }
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
wayland-egl = "0.32"
wayland-protocols = { version = "0.32", features = ["client", "staging"] }
ffmpeg-next = "9.1"
ffmpeg-sys-next = "9.1"
gl = "0.14"
serde_json = "1"
libc = "0.2"
lz4_flex = { version = "0.12", default-features = false }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "bmp"] }
fontdue = "0.9.5"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
