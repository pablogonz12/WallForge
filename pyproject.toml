[tool.ruff]
line-length = 130
target-version = "py311"

[tool.ruff.lint]
# Syntax errors, pyflakes and import order: the bugs that matter, without reformatting the code base.
select = ["E9", "F", "I"]

[tool.ruff.lint.per-file-ignores]
"wallforge/app.py" = ["E402"]  # gi.require_version must run before the GTK imports
"wallforge/webplayer.py" = ["E402"]
"wallforge/__main__.py" = ["E402"]
