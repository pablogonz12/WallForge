name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Lint
        run: |
          pip install ruff
          ruff check wallforge tests
      - name: Tests
        run: python -m unittest discover -s tests -v
      - name: Everything compiles
        run: python -m compileall -q wallforge

  renderer:
    # The renderer links ffmpeg and builds with the same toolchain the AUR package uses.
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - run: pacman -Syu --noconfirm git rust ffmpeg pkgconf clang make
      - uses: actions/checkout@v4
      - name: Tests
        run: cargo test --release --manifest-path render/Cargo.toml
